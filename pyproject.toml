[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamepresence"
dynamic = ["version"]
description = "Show any game as your Discord activity (Windows and Linux)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pywebview>=5.0", "requests>=2.31", "pypresence>=4.3"]

[project.optional-dependencies]
qt = ["pywebview[qt]>=5.0"]

[project.scripts]
gamepresence = "gamepresence.app:main"

[tool.setuptools.dynamic]
version = { attr = "gamepresence.__version__" }

[tool.setuptools.packages.find]
include = ["gamepresence*"]

[tool.setuptools.package-data]
gamepresence = ["ui/*.html"]
